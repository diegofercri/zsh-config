# Layout only. Colors are Starship's defaults, which are terminal color names,
# so the terminal's own theme decides how they look.

# One line of parts joined by " - ": user - host - ssh - directory - branch.
# Every part after the user brings its own leading separator, so a missing
# part leaves no gap.
format = "$username$hostname$directory$git_branch$git_status $all"

[username]
show_always = true
format = "[$user]($style)"

# The host is hidden in a local macOS session, where .zshrc sets
# PROMPT_HIDE_HOST. The ssh label only appears in SSH sessions; it carries its
# own separator because Starship does not hide a "(...)" group around
# $ssh_symbol.
[hostname]
ssh_only = false
detect_env_vars = ["!PROMPT_HIDE_HOST"]
ssh_symbol = " - [ssh](bold blue)"
format = " - [$hostname]($style)$ssh_symbol"

[directory]
format = " - [$path]($style)[$read_only]($read_only_style)"

[git_branch]
format = " - [$symbol$branch(:$remote_branch)]($style)"

[git_status]
format = '( [\[$all_status$ahead_behind\]]($style))'
