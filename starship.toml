# Dracula theme: palette and module colors from the official Dracula theme for
# Starship.
palette = "dracula"

# One line of parts joined by " - ": user - host - ssh - directory - branch.
# Every part after the user brings its own leading separator, so a missing
# part leaves no gap.
format = "$username$hostname$directory$git_branch$git_status $all"

# root keeps Starship's default red, as a warning.
[username]
show_always = true
style_user = "bold cyan"
format = "[$user]($style)"

# The host is hidden in a local macOS session, where .zshrc sets
# PROMPT_HIDE_HOST. The ssh label only appears in SSH sessions; it carries its
# own separator because Starship does not hide a "(...)" group around
# $ssh_symbol.
[hostname]
ssh_only = false
detect_env_vars = ["!PROMPT_HIDE_HOST"]
ssh_symbol = " - [ssh](bold orange)"
style = "bold purple"
format = " - [$hostname]($style)$ssh_symbol"

[directory]
style = "bold green"
format = " - [$path]($style)[$read_only]($read_only_style)"

[git_branch]
style = "bold pink"
format = " - [$symbol$branch(:$remote_branch)]($style)"

[git_status]
format = '( [\[$all_status$ahead_behind\]]($style))'

[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
