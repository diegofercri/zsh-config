# Dracula theme: palette and module colors from the official Dracula theme for
# Starship. Symbols and wording stay as Starship's defaults.
palette = "dracula"

[directory]
style = "bold green"

[git_branch]
style = "bold pink"

# root keeps Starship's default red, as a warning.
[username]
style_user = "bold cyan"

# Starship only shows the symbol in SSH sessions, so plain text says it better
# than the default globe emoji. It gets its own color to stand apart from the
# host name.
[hostname]
ssh_symbol = "ssh "
format = "[$ssh_symbol](bold orange)[$hostname]($style) in "
style = "bold purple"

[palettes.dracula]
background = "#282a36"
current_line = "#44475a"
foreground = "#f8f8f2"
comment = "#6272a4"
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"
